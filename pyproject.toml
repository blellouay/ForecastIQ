[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forecastiq"
version = "0.1.0"
description = "Agentic AI for adaptive retail demand forecasting"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = ["numpy>=1.26,<3", "pandas>=2,<3", "pyarrow>=14,<25", "scikit-learn>=1.3,<2", "lightgbm>=4,<5", "langgraph>=1,<2"]

[project.optional-dependencies]
dashboard = ["streamlit>=1.35,<2"]
llm = ["groq>=0.11,<1", "openai>=1.40,<3"]
neural = ["torch>=2.2,<3", "neuralforecast==3.3.0"]
dev = ["pytest>=8,<10", "ruff>=0.8,<1", "nbformat>=5.10,<6"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest_runtime"
markers = ["integration: requires private datasets or saved model artifacts"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
# Correctness-focused baseline; broader style cleanup can be introduced incrementally.
select = ["E9", "F63", "F7", "F82"]
