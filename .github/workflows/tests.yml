name: tests
on: [push, pull_request]

jobs:
  lightweight:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install numpy pandas scikit-learn langgraph pytest ruff
      - run: ruff check src dashboard examples tests
      - run: python -m pytest -q -m "not integration"
        env:
          FORECASTIQ_LLM_PROVIDER: offline
